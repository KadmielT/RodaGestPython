{% load i18n admin_urls %}
{% block object-tools-items %}
  {% if has_add_permission %}
    <li>
      <a href="{% url cl.opts|admin_urlname:'add' %}{% if is_popup %}?_popup=1{% endif %}"
         class="addlink">
        Adicionar {{ cl.opts.verbose_name|lower }} +
      </a>
    </li>
  {% endif %}
{% endblock %}
