{% load static %}

<aside class="rg-sidebar">

  <div class="rg-sidebar__brand">
    <div class="rg-sidebar__logo">RG</div>
    <div class="rg-sidebar__brand-text">
      <div class="rg-sidebar__name">RodaGest</div>
      <div class="rg-sidebar__tag">Painel</div>
    </div>
  </div>

  <nav class="rg-sidebar__nav" aria-label="Menu lateral">

    <details class="rg-group" open>
      <summary class="rg-group__title">
        <span class="rg-group__label">Cadastro</span>
        <span class="rg-group__chev" aria-hidden="true">›</span>
      </summary>

      <div class="rg-group__items">
        <a class="rg-nav-item {% if request.resolver_match.url_name == 'cliente_list' %}is-active{% endif %}"
           href="{% url 'clientes:cliente_list' %}">
          <span class="rg-nav-item__icon">👥</span>
          <span class="rg-nav-item__text">Clientes</span>
        </a>

        <a class="rg-nav-item {% if request.resolver_match.namespace == 'estoque_rodas' %}is-active{% endif %}"
           href="{% url 'estoque_rodas:roda_list' %}">
          <span class="rg-nav-item__icon">🛞</span>
          <span class="rg-nav-item__text">Estoque de rodas</span>
        </a>

        <a class="rg-nav-item {% if request.resolver_match.namespace == 'estoque_insumos' %}is-active{% endif %}"
           href="{% url 'estoque_insumos:insumo_list' %}">
          <span class="rg-nav-item__icon">🧪</span>
          <span class="rg-nav-item__text">Estoque de insumos</span>
        </a>
      </div>
    </details>

    <details class="rg-group" open>
      <summary class="rg-group__title">
        <span class="rg-group__label">Operações</span>
        <span class="rg-group__chev" aria-hidden="true">›</span>
      </summary>

      <div class="rg-group__items">
        <a class="rg-nav-item {% if request.resolver_match.namespace == 'servicos' %}is-active{% endif %}"
           href="{% url 'servicos:servico_list' %}">
          <span class="rg-nav-item__icon">🛠️</span>
          <span class="rg-nav-item__text">Serviços</span>
        </a>

        <a class="rg-nav-item {% if request.resolver_match.namespace == 'vendas' %}is-active{% endif %}"
           href="{% url 'vendas:venda_list' %}">
          <span class="rg-nav-item__icon">🛒</span>
          <span class="rg-nav-item__text">Vendas</span>
        </a>
      </div>
    </details>

  </nav>

</aside>
